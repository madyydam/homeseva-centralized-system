version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeseva_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeseva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeseva_pass}
      POSTGRES_DB: ${POSTGRES_DB:-homeseva_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/vps-setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeseva} -d ${POSTGRES_DB:-homeseva_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homeseva_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: homeseva_web
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeseva}:${POSTGRES_PASSWORD:-homeseva_pass}@postgres:5432/${POSTGRES_DB:-homeseva_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_change_in_production}
      SUPER_ADMIN_TEMP_PASSWORD: ${SUPER_ADMIN_TEMP_PASSWORD:-ChangeMe@123}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    container_name: homeseva_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

