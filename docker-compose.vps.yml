services:
  postgres:
    image: postgres:16-alpine
    container_name: homeseva_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeseva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeseva_pass}
      POSTGRES_DB: ${POSTGRES_DB:-homeseva_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeseva} -d ${POSTGRES_DB:-homeseva_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homeseva_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: homeseva_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeseva}:${POSTGRES_PASSWORD:-homeseva_pass}@postgres:5432/${POSTGRES_DB:-homeseva_db}?connection_limit=15&pool_timeout=20
      DIRECT_URL: postgresql://${POSTGRES_USER:-homeseva}:${POSTGRES_PASSWORD:-homeseva_pass}@postgres:5432/${POSTGRES_DB:-homeseva_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_change_in_production}
      AUTH_SECRET: ${AUTH_SECRET:-your_super_secure_random_64_char_auth_secret_key_here}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-homeseva_user_session}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-604800}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-madyydam}
      SUPER_ADMIN_TEMP_PASSWORD: ${SUPER_ADMIN_TEMP_PASSWORD:-ChangeMe@123}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Automated SMTP Email Credentials
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"HomeSeva ERP <madhurdhadve7@gmail.com>"}
      # Cloud Database Fallback (Optional)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    container_name: homeseva_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
