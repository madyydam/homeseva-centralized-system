<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSeva ERP - Connection</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #151821 0%, #06070a 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-block;
      background: rgba(234, 88, 12, 0.15);
      color: #fb923c;
      border: 1px solid rgba(234, 88, 12, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fb923c;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .current-url {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 20px;
      user-select: text;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }
    .url-input-box {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }
    .url-input-box.open {
      display: flex;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
    }
    input {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: white;
      outline: none;
      width: 100%;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse-dot"></span> Server Offline
    </div>
    <h1>Connecting to HomeSeva ERP</h1>
    <p>Could not reach the HomeSeva server. Please check your network or make sure the server process is running.</p>

    <div class="current-url" id="displayUrl">http://localhost:3000</div>

    <div class="btn-group">
      <button class="btn-primary" onclick="retryConnection()">Retry Connection</button>
      <button class="btn-secondary" onclick="toggleUrlInput()">Change Server URL</button>
    </div>

    <div class="url-input-box" id="urlBox">
      <label for="serverInput">Enter Server or VPS URL:</label>
      <input type="text" id="serverInput" placeholder="https://your-domain.com or http://localhost:3000" />
      <button class="btn-primary" onclick="saveNewServer()">Save & Connect</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.electronAPI) {
        const url = await window.electronAPI.getServerUrl();
        document.getElementById('displayUrl').innerText = url;
        document.getElementById('serverInput').value = url;
      }
    });

    function retryConnection() {
      if (window.electronAPI) {
        window.electronAPI.retryConnection();
      } else {
        window.location.reload();
      }
    }

    function toggleUrlInput() {
      const box = document.getElementById('urlBox');
      box.classList.toggle('open');
    }

    async function saveNewServer() {
      const val = document.getElementById('serverInput').value.trim();
      if (!val) return;
      if (window.electronAPI) {
        await window.electronAPI.setServerUrl(val);
      }
    }
  </script>
</body>
</html>
