<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSeva ERP — Updating</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #11141f 0%, #050609 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
    }
    /* Logo glow emblem */
    .logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(59, 130, 246, 0) 70%);
      border-radius: 50%;
      animation: pulse-glow 2.5s infinite ease-in-out;
      will-change: transform, opacity;
      transform: translateZ(0);
    }
    .logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(59, 130, 246, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.04em;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.6);
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }

    /* Titles */
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .version-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 16px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      will-change: transform;
      transform: translateZ(0);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Progress bar container */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      will-change: width;
      transform: translateZ(0);
    }
    .progress-meta {
      display: none;
      justify-content: space-between;
      width: 100%;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      font-mono: true;
    }

    /* Indeterminate line for checking state */
    .indeterminate-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .indeterminate-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: indeterminate 1.4s ease-in-out infinite;
      border-radius: 9999px;
      will-change: left;
      transform: translateZ(0);
    }
    @keyframes indeterminate {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    .footer-note {
      margin-top: 28px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <div class="logo-box">
        <span class="logo-text">H</span>
      </div>
    </div>

    <h1>HomeSeva ERP</h1>
    <div class="version-tag" id="versionText">Centralized Platform v1.6</div>

    <div class="status-text" id="statusLabel">
      <div class="spinner" id="statusSpinner"></div>
      <span id="statusMessage">Checking for updates...</span>
    </div>

    <!-- Indeterminate bar (during check) -->
    <div class="indeterminate-bar" id="indeterminateBar">
      <div class="indeterminate-fill"></div>
    </div>

    <!-- Live progress bar (during download) -->
    <div class="progress-bar-container" id="progressBar">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="progress-meta" id="progressMeta">
      <span id="progressPercent">0%</span>
      <span id="progressDetails">Downloading update package...</span>
    </div>

    <div class="footer-note" id="footerNote">
      Connecting to HomeSeva Secure Cloud
    </div>

    <!-- Interactive Simulation Trigger for Preview -->
    <button id="replayBtn" onclick="runSimulation()" style="display:none; margin-top:20px; background:rgba(59,130,246,0.12); border:1px solid rgba(59,130,246,0.3); color:#60a5fa; font-size:11px; font-weight:700; padding:7px 16px; border-radius:999px; cursor:pointer; transition:all 0.2s;">
      ▶ Play Update Animation Demo
    </button>
  </div>

  <script>
    const statusSpinner = document.getElementById('statusSpinner');
    const statusMessage = document.getElementById('statusMessage');
    const indeterminateBar = document.getElementById('indeterminateBar');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressMeta = document.getElementById('progressMeta');
    const progressPercent = document.getElementById('progressPercent');
    const progressDetails = document.getElementById('progressDetails');
    const footerNote = document.getElementById('footerNote');
    const replayBtn = document.getElementById('replayBtn');

    function applyUpdateState(data) {
      if (!data) return;

      if (data.status === 'checking') {
        indeterminateBar.style.display = 'block';
        progressBar.style.display = 'none';
        progressMeta.style.display = 'none';
        statusSpinner.style.display = 'block';
        statusMessage.innerText = 'Checking for updates...';
        footerNote.innerText = 'Connecting to HomeSeva Secure Cloud';
      } else if (data.status === 'available') {
        indeterminateBar.style.display = 'none';
        progressBar.style.display = 'block';
        progressMeta.style.display = 'flex';
        statusSpinner.style.display = 'block';
        statusMessage.innerText = `New update found (v${data.version || '1.4.0'})! Downloading...`;
        footerNote.innerText = 'Downloading latest release in background...';
      } else if (data.status === 'downloading') {
        indeterminateBar.style.display = 'none';
        progressBar.style.display = 'block';
        progressMeta.style.display = 'flex';
        const pct = Math.round(data.percent || 0);
        progressFill.style.width = pct + '%';
        progressPercent.innerText = pct + '%';
        statusMessage.innerText = `Downloading update: ${pct}%`;
        if (data.transferred && data.total) {
          progressDetails.innerText = `${data.transferred} / ${data.total}`;
        }
      } else if (data.status === 'downloaded') {
        indeterminateBar.style.display = 'none';
        progressBar.style.display = 'block';
        progressFill.style.width = '100%';
        progressPercent.innerText = '100%';
        statusSpinner.style.display = 'none';
        statusMessage.innerHTML = '<span style="color:#10b981; font-weight:800;">✓ Update complete! Reopening ERP...</span>';
        footerNote.innerText = 'Applying update and restarting application automatically...';
      } else if (data.status === 'not-available' || data.status === 'up-to-date') {
        indeterminateBar.style.display = 'none';
        progressBar.style.display = 'none';
        progressMeta.style.display = 'none';
        statusSpinner.style.display = 'none';
        statusMessage.innerHTML = '<span style="color:#10b981; font-weight:800;">✓ Up to date! Starting HomeSeva...</span>';
      } else if (data.status === 'starting-erp') {
        indeterminateBar.style.display = 'none';
        progressBar.style.display = 'none';
        progressMeta.style.display = 'none';
        statusMessage.innerText = 'Launching HomeSeva ERP...';
      }
    }

    if (window.electronAPI && window.electronAPI.onUpdateStatus) {
      window.electronAPI.onUpdateStatus(applyUpdateState);
    } else {
      // Browser preview mode: automatically play the simulation
      replayBtn.style.display = 'inline-block';
      setTimeout(runSimulation, 600);
    }

    function runSimulation() {
      applyUpdateState({ status: 'checking' });

      setTimeout(() => {
        applyUpdateState({ status: 'available', version: '1.6.0' });

        let pct = 0;
        const interval = setInterval(() => {
          pct += 8;
          if (pct >= 100) {
            pct = 100;
            clearInterval(interval);
            applyUpdateState({
              status: 'downloading',
              percent: 100,
              transferred: '77.2 MB',
              total: '77.2 MB',
            });
            setTimeout(() => {
              applyUpdateState({ status: 'downloaded', version: '1.6.0' });
            }, 600);
          } else {
            const currentMB = ((pct / 100) * 77.2).toFixed(1);
            applyUpdateState({
              status: 'downloading',
              percent: pct,
              transferred: `${currentMB} MB`,
              total: '77.2 MB',
            });
          }
        }, 220);
      }, 1400);
    }
  </script>
</body>
</html>
